<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>P2P Audio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<style>
  :root { --panel:#121212; --card:#1f1f1f; --sub:#b3b3b3; --green:#1db954; --tint:#1d3a2a;
          --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); color-scheme: dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html { height:100%; }
  body { margin:0; background:#000; color:#fff; height:100vh; height:100dvh; display:flex; flex-direction:column;
         overflow:auto; overscroll-behavior:none;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h2 { margin:0 0 4px; font-size:28px; }
  h3 { margin:24px 0 8px; font-size:18px; }
  h4 { margin:18px 0 6px; font-size:12px; color:var(--sub); letter-spacing:.08em; text-transform:uppercase; }
  small, .sub { color:var(--sub); }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:500px; padding:9px 18px;
           background:#fff; color:#000; touch-action:manipulation; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .green { background:var(--green); color:#000; }
  .green:hover { filter:brightness(1.08); }
  .ghost { background:transparent; color:#fff; border:1px solid #727272; }
  .red { background:#e22134; color:#fff; }
  input[type=text], input[type=search], input[type=email], input[type=password], select, textarea {
    display:block; width:100%; background:#2a2a2a; color:#fff; font:inherit; font-size:16px;
    border:1px solid transparent; border-radius:6px; padding:10px 12px; }
  input[type=file] { color:var(--sub); max-width:100%; }
  input[type=search] { border-radius:500px; padding:12px 18px; }

  /* ---------- auth ---------- */
  #loading { text-align:center; margin-top:30vh; color:var(--sub); }
  #loginBox, #nameBox { width:calc(100% - 32px); max-width:340px; margin:12vh auto 0; background:var(--panel); padding:32px; border-radius:12px; }
  #loginBox input, #nameBox input { margin-bottom:12px; }
  #loginBox br { display:none; }
  #loginBox button[onclick="login()"], #nameBox button { background:var(--green); color:#000; }
  #loginBox button[onclick="signup()"] { background:transparent; color:#fff; border:1px solid #727272; }
  #msg, #nmsg { color:#f15e6c; }

  /* ---------- app shell ---------- */
  #appBox { display:none; flex:1; min-height:0; flex-direction:column; overflow:hidden; }
  #layout { flex:1; min-height:0; display:flex; gap:8px; padding:8px 8px 0; }
  #nav { width:260px; flex-shrink:0; background:var(--panel); border-radius:8px; padding:8px; display:flex; flex-direction:column; min-height:0; }
  .nv { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:transparent; color:var(--sub);
        border-radius:6px; padding:11px 12px; font-weight:700; position:relative; }
  .nv:hover { color:#fff; }
  .nv.on { color:#fff; background:var(--card); }
  .nv svg { width:22px; height:22px; flex-shrink:0; }
  .nv.prof { padding:10px 12px; margin-bottom:4px; color:#fff; }
  .nv.prof span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #navLists { flex:1; min-height:0; overflow-y:auto; }
  .pli { padding:7px 12px; gap:12px; font-weight:600; }
  .pli .pn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pic { width:36px; height:36px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(135deg,var(--green),#2b3a67); color:#fff; font-size:14px; }
  .pic.liked { background:linear-gradient(135deg,#5b4bff,#b9a7ff); }
  .pic.rec { background:linear-gradient(135deg,#0d7377,#32e0c4); }
  #navBottom { border-top:1px solid #222; padding-top:6px; margin-top:6px; }
  .badge { background:var(--green); color:#000; border-radius:999px; font-size:11px; min-width:18px; height:18px; line-height:18px;
           padding:0 5px; text-align:center; font-weight:800; }
  #nav .badge { margin-left:auto; }
  .av { width:36px; height:36px; border-radius:50%; background:var(--green) center/cover no-repeat; color:#000; font-weight:800;
        display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; padding:0; border:0; }
  .av.big { width:96px; height:96px; font-size:40px; border:4px solid var(--panel); }

  #wrap { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--panel); border-radius:8px; overflow:hidden; }
  #phoneTop { display:none; align-items:center; gap:12px; padding:calc(10px + var(--sat)) 16px 8px; background:var(--panel); }
  #ptTitle { flex:1; font-weight:800; font-size:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ib { background:transparent; color:#fff; padding:6px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1; }
  .ib svg { width:24px; height:24px; }
  #main { flex:1; min-height:0; overflow-y:auto; padding:24px 28px 28px; overscroll-behavior:contain;
          background:linear-gradient(var(--tint), var(--panel) 260px); }

  /* ---------- dock: call bar, player, tab bar ---------- */
  #dock { flex-shrink:0; background:#000; }
  #incomingbar { display:none; align-items:center; gap:10px; padding:10px 16px; background:#252525; border-top:1px solid #444; }
  #incomingbar.on { display:flex; }
  #incomingbar span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #incomingbar button { padding:8px 14px; }
  #callbar { display:none; align-items:center; gap:10px; padding:8px 16px; background:var(--green); color:#000; font-weight:700; }
  #callbar.on { display:flex; }
  #callbar span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #callbar button { background:#000; color:#fff; padding:8px 16px; }
  #callbar button.red { background:#e22134; }
  #bar { position:relative; height:84px; padding:0 16px; display:flex; align-items:center; gap:16px; border-top:1px solid #222; }
  #miniProg { display:none; position:absolute; left:0; top:0; height:2px; width:0; background:var(--green); }
  #np { width:28%; min-width:0; display:flex; flex-direction:column; cursor:pointer; }
  #np b, #np small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ctl { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #ctl .btns { display:flex; gap:10px; align-items:center; }
  #ctl .btns button { padding:6px 14px; }
  #seekrow { display:flex; align-items:center; gap:8px; width:100%; max-width:520px; font-size:12px; color:var(--sub); }
  #seek { flex:1; accent-color:var(--green); }
  #tabbar { display:none; border-top:1px solid #222; padding-bottom:var(--sab); }
  .tb { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:transparent; color:var(--sub);
        padding:8px 2px 6px; font-size:11px; border-radius:0; position:relative; }
  .tb.on { color:#fff; }
  .tb svg { width:24px; height:24px; }
  .tb .badge { position:absolute; top:3px; left:calc(50% + 6px); }

  /* ---------- content pieces ---------- */
  .song, .prow { display:flex; align-items:center; gap:10px; padding:8px; border-radius:6px; }
  .song:hover, .prow:hover { background:var(--card); }
  .prow { cursor:pointer; }
  .song .t, .prow .t { flex:1; min-width:0; display:flex; flex-direction:column; cursor:pointer; }
  .song .t b, .prow .t b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .song.cur .t b { color:var(--green); }
  .pl { width:40px; height:40px; padding:0; background:var(--green); flex-shrink:0; }
  .ico { background:transparent; color:var(--sub); padding:6px 10px; font-size:18px; }
  .ico.on { color:var(--green); }
  .form { max-width:460px; display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .form label { display:flex; align-items:center; gap:8px; }
  .form label.fl { flex-direction:column; align-items:stretch; gap:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--card); border-radius:500px; padding:6px 14px; font-size:14px; cursor:pointer; border:0; color:#fff; font-weight:600; }
  .chip.sel { background:var(--green); color:#000; }
  .tag { font-size:12px; border:1px solid #727272; border-radius:500px; padding:2px 8px; color:var(--sub); white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:8px; padding:12px; text-align:left; color:#fff; display:flex; flex-direction:column; gap:4px; font-weight:600; min-width:0; }
  .card:hover { background:#2a2a2a; }
  .card b, .card small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .cv { aspect-ratio:1; border-radius:6px; margin-bottom:6px; display:flex; align-items:center; justify-content:center;
              font-size:38px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--green),#2b3a67); }
  .cv.liked { background:linear-gradient(135deg,#5b4bff,#b9a7ff); }
  .cv.rec { background:linear-gradient(135deg,#0d7377,#32e0c4); }
  .quick { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-top:12px; }
  .qt { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.08); color:#fff; border-radius:6px; padding:0 12px 0 0;
        height:56px; text-align:left; overflow:hidden; font-weight:700; }
  .qt:hover { background:rgba(255,255,255,.16); }
  .qt .pic { width:56px; height:56px; border-radius:0; font-size:20px; }
  .qt span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chatbox { margin-top:24px; border:1px solid #333; border-radius:10px; overflow:hidden; }
  .chathead { padding:12px 14px; background:#202020; font-weight:800; }
  .chatmessages { display:flex; flex-direction:column; gap:10px; padding:12px; max-height:360px; overflow:auto; }
  .chatmsg { align-self:flex-start; max-width:min(88%,560px); background:#292929; border-radius:14px 14px 14px 4px; padding:9px 12px; overflow-wrap:anywhere; }
  .chatmsg.mine { align-self:flex-end; background:var(--tint); border-radius:14px 14px 4px 14px; }
  .chatmsg img { display:block; max-width:100%; max-height:260px; border-radius:8px; margin-top:5px; }
  .chatmeta { display:flex; align-items:center; gap:8px; margin-top:5px; color:var(--sub); font-size:11px; }
  .chatlike { background:transparent; color:var(--sub); padding:2px 5px; font-size:12px; }
  .chatlike.liked { color:#ff5d8f; }
  .chatcompose { padding:12px; border-top:1px solid #333; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chatcompose input[type=text] { flex:1; min-width:140px; }
  .chatcompose input[type=file] { width:100%; }
  .row { display:flex; gap:6px; align-items:center; margin:2px 0; padding:6px 8px; border-radius:6px; }
  .row:hover { background:var(--card); }
  .row span { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .row span.lnk { cursor:pointer; }
  .row button { padding:7px 14px; font-size:13px; background:transparent; color:#fff; border:1px solid #727272; }
  .row button:first-of-type { background:var(--green); color:#000; border-color:var(--green); }
  #reqOut .row button, #pfFriends .row button { background:transparent; color:#fff; border:1px solid #727272; }
  .banner { height:160px; border-radius:12px; background:linear-gradient(135deg,var(--tint),#000) center/cover no-repeat; }
  .pfhead { display:flex; align-items:flex-end; gap:16px; margin:-48px 16px 12px; position:relative; }
  textarea { resize:vertical; }
  input[type=color] { width:44px; height:34px; border:0; background:none; padding:0; cursor:pointer; vertical-align:middle; }
  .eq { display:flex; gap:18px; }
  .eqb { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .eqb input { writing-mode:vertical-lr; direction:rtl; height:120px; accent-color:var(--green); }
  dialog { background:var(--panel); color:#fff; border:1px solid #333; border-radius:12px; padding:20px; min-width:280px; max-width:90vw; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  #toast { position:fixed; left:50%; bottom:130px; transform:translateX(-50%); background:#fff; color:#000; padding:10px 18px;
           border-radius:500px; font-weight:700; display:none; z-index:30; max-width:90vw; text-align:center; }
  #bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:-1; display:none; }
  body.hasbg #bg { display:block; }
  body.hasbg #nav, body.hasbg #wrap, body.hasbg #phoneTop { background:rgba(18,18,18,.72); }
  body.hasbg #main { background:transparent; }
  body.hasbg #dock { background:rgba(0,0,0,.6); }

  /* ---------- full-screen player ---------- */
  #full { position:fixed; inset:0; z-index:20; background:linear-gradient(var(--tint),#000 70%); display:flex; flex-direction:column;
          align-items:center; padding:calc(16px + var(--sat)) 20px calc(24px + var(--sab)); gap:10px; overflow:hidden; }
  #full[hidden] { display:none; }
  #fClose { align-self:flex-start; padding:6px 16px; }
  #fLyr { position:absolute; top:calc(16px + var(--sat)); right:16px; }
  #stage { position:relative; flex:1; min-height:0; aspect-ratio:1; max-width:100%; display:flex; align-items:center; justify-content:center; }
  #viz { position:absolute; inset:0; width:100%; height:100%; }
  #art { position:relative; width:54%; aspect-ratio:1; border-radius:50%; overflow:hidden; background:linear-gradient(135deg,#1db954,#2b3a67); transition:transform .08s; }
  #art::after { content:"♪"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:48px; }
  #cover { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; visibility:hidden; }
  #lyr { display:none; flex:1; min-height:0; width:100%; max-width:560px; overflow-y:auto; text-align:center; font-size:26px; font-weight:800; line-height:1.4; padding:30vh 0; }
  #lyr p { margin:12px 0; color:#777; cursor:pointer; }
  #lyr p.now { color:#fff; }
  #lyr .dim { color:var(--sub); font-size:16px; font-weight:400; }
  #full.lyrics #stage { display:none; }
  #full.lyrics #lyr { display:block; }
  .finfo { display:flex; align-items:center; gap:8px; width:100%; max-width:520px; }
  .finfo > div { flex:1; min-width:0; }
  #prog { width:100%; max-width:520px; height:56px; cursor:pointer; touch-action:none; }
  .ftime { display:flex; justify-content:space-between; width:100%; max-width:520px; font-size:12px; color:var(--sub); }
  .fctl { display:flex; gap:14px; align-items:center; }
  #fPP { width:56px; height:56px; padding:0; font-size:20px; }

  /* ---------- phones: bottom tab bar, compact player, no side panel ---------- */
  @media (max-width:820px) {
    #nav { display:none; }
    #layout { padding:0; gap:0; }
    #wrap { border-radius:0; }
    #phoneTop { display:flex; }
    #main { padding:12px 16px 20px; }
    h2 { font-size:24px; }
    #tabbar { display:flex; }
    #bar { height:62px; padding:0 12px; gap:8px; }
    #miniProg { display:block; }
    #np { flex:1; width:auto; }
    #seekrow { display:none; }
    #ctl { flex:none; }
    #ctl .btns { gap:4px; }
    #ctl .btns button { width:44px; height:44px; padding:0; }
    #toast { bottom:calc(150px + var(--sab)); }
    .grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
    .quick { grid-template-columns:1fr 1fr; gap:8px; }
    .qt { height:52px; font-size:13px; }
    .qt .pic { width:52px; height:52px; }
    dialog { margin:auto 0 0; width:100%; max-width:100%; border-radius:16px 16px 0 0; padding-bottom:calc(20px + var(--sab)); }
    .song, .prow { padding:6px 4px; }
    .ico { padding:8px 10px; }
  }

  /* Motion changes behavior without replacing the user's theme. */
  :root { --ease-out:cubic-bezier(.22,1,.36,1); }
  button, [role=button], .song, .prow, .row {
    transition:transform 160ms var(--ease-out), background-color 180ms ease, color 180ms ease, opacity 160ms ease, filter 160ms ease;
  }
  button:active:not(:disabled), [role=button]:active { transform:scale(.96); }
  button:disabled { cursor:default; opacity:.55; }
  input, textarea, select { transition:border-color 160ms ease, box-shadow 160ms ease; }
  #main, #navLists, .chatmessages, #lyr { -webkit-overflow-scrolling:touch; scrollbar-gutter:stable; }
  #miniProg { transition:width 220ms linear; }
  #lyr p { transition:color 200ms ease; }
  #incomingbar.on, #callbar.on { animation:surface-in 240ms var(--ease-out); }
  dialog[open] { animation:surface-in 260ms var(--ease-out); }
  dialog[open]::backdrop { animation:backdrop-in 200ms ease; }
  @keyframes surface-in { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes backdrop-in { from { opacity:0; } to { opacity:1; } }
  @media (hover:hover) and (pointer:fine) {
    .card:hover { transform:translateY(-3px); }
    .qt:hover { transform:translateY(-2px); }
    button:hover:not(:disabled) { filter:brightness(1.08); }
  }
  @media (pointer:coarse) {
    .ico, .ib, .chatlike { min-width:44px; min-height:44px; }
    .row button { min-height:44px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }

  /* Translucent playback surfaces inherit the current theme. */
  #prev, #pp, #next, #fPrev, #fPP, #fNext {
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:44px; height:44px; padding:10px !important; color:#fff;
    border:1px solid rgba(255,255,255,.25);
    background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.05));
    -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.18);
  }
  #pp, #fPP { background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.10)); }
  #fPP { width:60px; height:60px; }
  #prev svg, #pp svg, #next svg, #fPrev svg, #fPP svg, #fNext svg { width:22px; height:22px; fill:currentColor; }
  #fPP svg { width:28px; height:28px; }
  #prog { display:block; flex-shrink:0; cursor:grab; touch-action:none; }
  #prog.seeking { cursor:grabbing; }

  #updateNotice { position:fixed; z-index:100; top:calc(14px + var(--sat)); left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:13px 20px; max-width:calc(100vw - 32px); border-radius:22px;
    background:linear-gradient(135deg,rgba(45,45,45,.94),rgba(22,22,22,.88)); color:#fff;
    border:1px solid rgba(255,255,255,.25); box-shadow:inset 0 1px 0 #ffffff26,0 8px 28px #0005;
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    font-size:14px; font-weight:650; pointer-events:none; }
  #updateNotice span { color:var(--green); }

  #updateAvailable { position:fixed; z-index:99; top:calc(14px + var(--sat)); left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 24px); border:1px solid #ffffff40; border-radius:20px; background:#222e; backdrop-filter:blur(20px); color:white; padding:10px 14px; font-size:14px; box-shadow:0 8px 28px #0005; }
  #loadUpdate { padding:8px 12px; margin-left:6px; }
  #fLike, #fAdd, [data-act="fav"], [data-act="add"] { position:relative; overflow:visible; }
  .music-action-burst::after { content:""; position:absolute; inset:5px; border:2px solid var(--green); border-radius:50%; pointer-events:none; animation:music-action-ring 620ms ease-out both; }
  .music-action-burst::before { content:"✦"; position:absolute; top:0; right:0; color:var(--green); font-size:15px; line-height:1; pointer-events:none; animation:music-action-spark 620ms ease-out both; text-shadow:0 0 10px var(--green); }
  @keyframes music-action-ring { 0% { opacity:.85; transform:scale(.6); } 55% { opacity:.5; } 100% { opacity:0; transform:scale(2); } }
  @keyframes music-action-spark { 0% { opacity:0; transform:translate(0,0) scale(.3); } 25% { opacity:1; } 100% { opacity:0; transform:translate(12px,-18px) scale(1.2) rotate(70deg); } }
</style>
</head>
<body>

<img id="bg" alt="">
<p id="loading">Loading...</p>

<div id="loginBox" style="display:none">
  <h3 style="margin-top:0">Log in</h3>
  <input id="email" type="email" placeholder="Email" autocomplete="email"><br>
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password"><br>
  <button onclick="login()">Log in</button>
  <button onclick="signup()">Sign up</button>
  <p id="msg"></p>
</div>

<div id="nameBox" style="display:none">
  <h3 style="margin-top:0">Pick a username</h3>
  <input id="uname" type="text" placeholder="3-20 letters, numbers, _">
  <button onclick="saveName()">Save</button>
  <p id="nmsg"></p>
</div>

<div id="appBox">
  <div id="layout">

// Fingerprint the delivered source before runtime rendering changes the DOM.
// Future HTML, CSS, or JS edits automatically count as a new website version.
function sourceVersion(doc) {
  const source = Array.from(doc.querySelectorAll('style, script')).map(el => el.getAttribute('src') || el.textContent).join('\n');
  let hash = 2166136261;
  for (let i = 0; i < source.length; i++) hash = Math.imul(hash ^ source.charCodeAt(i), 16777619);
  return (hash >>> 0).toString(16);
}
const deliveredVersion = sourceVersion(document);
// Keep the existing Supabase storage key, with an IndexedDB fallback for Safari.
function authDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('p2p-auth', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('session');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function authDisk(method, key, value) {
  const db = await authDatabase();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction('session', method === 'get' ? 'readonly' : 'readwrite');
      const store = tx.objectStore('session');
      const request = method === 'get' ? store.get(key) : method === 'put' ? store.put(value, key) : store.delete(key);
      tx.oncomplete = () => resolve(request.result ?? null);
      tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error);
    });
  } finally { db.close(); }
}
const persistentAuthStorage = {
  async getItem(key) {
    try { const value = localStorage.getItem(key); if (value !== null) return value; } catch (e) {}
    try { return await authDisk('get', key); } catch (e) { return null; }
  },
  async setItem(key, value) {
    let saved = false;
    try { localStorage.setItem(key, value); saved = true; } catch (e) {}
    try { await authDisk('put', key, value); saved = true; } catch (e) {}
    if (!saved) console.warn('This browser could not persist the sign-in session.');
  },
  async removeItem(key) {
    try { localStorage.removeItem(key); } catch (e) {}
    try { await authDisk('delete', key); } catch (e) {}
  }
};
// Old email verification links can retain an auth error forever in a bookmark.

// valid sign-in/recovery callbacks and the existing persistent session.
function clearFailedAuthFragment() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (!params.has('error') || params.has('access_token') || params.has('refresh_token')) return false;
  history.replaceState(history.state, '', location.pathname + location.search);
  return true;
}

/* Cancel superseded motion so rapid interactions remain responsive. */
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const motions = new WeakMap();
function motion(el, frames, duration = 220) {
  if (!el) return Promise.resolve();
  motions.get(el)?.cancel();
  if (reducedMotion.matches || !el.animate) return Promise.resolve();
  const animation = el.animate(frames, {duration, easing:'cubic-bezier(.22,1,.36,1)'});
  motions.set(el, animation);
  return animation.finished.catch(() => {}).finally(() => {
    if (motions.get(el) === animation) motions.delete(el);
  });
}
function closeDialog(d) {

  d.dataset.closing = '1';

    .then(() => { d.close(); delete d.dataset.closing; });
}

/* ---------- signed urls and avatars ---------- */
const urlCache = new Map();
async function signed(bucket, path) {
  if (!path) return null;
  const k = bucket + '/' + path, c = urlCache.get(k);
  if (c && c.exp > Date.now()) return c.url;
  const { data } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (!data) return null;
  urlCache.set(k, { url: data.signedUrl, exp: Date.now() + 50 * 60 * 1000 });
  return data.signedUrl;
}

}

let startingSession = null, appUserId = null, authGeneration = 0;
async function logout() {
  const { error } = await sb.auth.signOut({scope:'local'});
  if (error) return toast(error.message);
  location.reload();

function sessionError(message) {
  if (appUserId) { toast(message); return; }
  show('loading');
  $('loading').style.display = 'block';
  $('loading').textContent = message;
  const retry = document.createElement('button');
  retry.textContent = 'Retry'; retry.onclick = () => start();
  $('loading').appendChild(document.createElement('br')); $('loading').appendChild(retry);
}
function start() {
  if (startingSession) return startingSession;
  startingSession = restoreSession().catch(e => sessionError('Could not restore your session. Check your connection and retry.'))
    .finally(() => { startingSession = null; });
  return startingSession;
}
async function restoreSession() {
  const generation = authGeneration;
  const { data, error } = await sb.auth.getSession();
  if (generation !== authGeneration) return;
  if (error) return sessionError('Could not restore your session. Check your connection and retry.');
  if (!data.session) { me = null; return show('loginBox'); }
  if (appUserId === data.session.user.id) return;
  me = {...data.session.user};
  const { data: p, error: profileError } = await sb.from('profiles')
    .select('username,bio,avatar_path,backdrop_path,fav_songs').eq('id', me.id).maybeSingle();
  if (generation !== authGeneration) return;
  if (profileError) return sessionError('You are signed in, but your profile could not load. Please retry.');
  if (!p) return show('nameBox');
  prof = p; me.username = p.username;
  appUserId = me.id;
  try { await openApp(); } catch (e) { appUserId = null; throw e; }
}
// Defer work outside the auth callback to avoid holding Supabase's auth lock.

  } else if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
    setTimeout(() => start(), 0);
  }
});

async function changeUsername() {

  const name = field.value.trim().toLowerCase().replace(/^@/, '');
  if (!/^[a-z0-9_]{3,20}$/.test(name)) { msg.textContent = 'Use 3–20 lowercase letters, numbers, or underscores.'; return; }

  memberOf = new Set((m || []).map(r => r.playlist_id));
}
async function refreshFriends() {
  const { data: rows, error } = await sb.from('friend_requests').select('id,sender,receiver,status');
  if (error || !rows) return;
  const ids = [...new Set(rows.flatMap(r => [r.sender, r.receiver]))].filter(i => i !== me.id);
  const names = {};
  if (ids.length) {
    const { data: ps } = await sb.from('profiles').select('id,username').in('id', ids);
    (ps || []).forEach(p => names[p.id] = p.username);
  }
  friends = []; incoming = []; outgoing = [];
  for (const r of rows) {
    const other = r.sender === me.id ? r.receiver : r.sender;
    const item = { rid: r.id, id: other, username: names[other] || '?' };
    if (r.status === 'accepted') friends.push(item);
    else if (r.receiver === me.id) incoming.push(item);
    else outgoing.push(item);
  }
  updateBadges();
  if (view === 'friends') renderFriendLists();
}

/* ---------- list helpers ---------- */
const head = (title, subtitle) => `<h2>${esc(title)}</h2><p class="sub">${esc(subtitle || '')}</p>`;
const empty = msg => `<p class="sub" style="margin-top:16px">${msg}</p>`;
function songRows(list, key, extra) {
  lists[key] = list;
  return list.map((s, i) => `
    <div class="song ${s.id === curId ? 'cur' : ''}" data-l="${key}" data-i="${i}" data-sid="${s.id}">
      <button class="pl" data-act="play" aria-label="Play ${esc(s.title)}">▶</button>
      <div class="t" data-act="play"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></div>
      <button class="ico ${favs.has(s.id) ? 'on' : ''}" data-act="fav" aria-label="Save to favorites">♥</button>
      <button class="ico" data-act="add" aria-label="Add to playlist">＋</button>
      ${extra ? extra(s) : ''}
    </div>`).join('');
}
const playlistCard = p => `
  <button class="card" data-act="open" data-id="${p.id}">
    <div class="cv">${esc((p.name || '?')[0].toUpperCase())}</div>
    <b>${esc(p.name)}</b><small>by ${esc(p.profiles?.username || 'unknown')}</small>
  </button>`;
const playlistRow = p => `
  <div class="prow" data-act="open" data-id="${p.id}">
    <span class="pic">${esc((p.name || '?')[0].toUpperCase())}</span>
    <div class="t"><b>${esc(p.name)}</b><small>by ${esc(p.profiles?.username || 'unknown')}</small></div>
    <span class="tag">${p.is_public ? 'Public' : 'Private'}</span>
    ${p.collaborative ? '<span class="tag">Co-op</span>' : ''}
  </div>`;
function row(text, buttons, onText) {
  const d = document.createElement('div'); d.className = 'row';
  const s = document.createElement('span'); s.textContent = text;
  if (onText) { s.className = 'lnk'; s.onclick = onText; }
  d.appendChild(s);
  for (const [label, fn] of buttons) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; d.appendChild(b); }
  return d;
}
function fill(id, items, make, emptyText) {
  const el = $(id); if (!el) return;
  el.replaceChildren();
  if (!items.length && emptyText) { const p = document.createElement('small'); p.textContent = emptyText; el.appendChild(p); }
  items.forEach(i => el.appendChild(make(i)));
}

/* ---------- views ---------- */
async function render(keep) {
  const tok = ++renderTok, m = $('main'), st = m.scrollTop;
  renderNavLists(); markNav();
  lists = {};
  const [html, after] = await build(view);
  if (tok !== renderTok) return;
  if (!keep) await motion(m, [{opacity:1},{opacity:0}],90);
  if (tok !== renderTok) return;
  m.innerHTML = html;
  m.scrollTop = keep ? st : 0;
  if (after) after();
  if (!keep) motion(m, [{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}]);
}

function renderResults() {
  const el = $('results'); if (!el) return;
  const k = query.toLowerCase();
  if (!k) {
    el.innerHTML = '<h3>All songs</h3>' + (songs.length ? songRows(songs, 'all') : empty('No songs yet. Add audio files in the Upload tab.'));
    return;
  }
  const hits = songs.filter(s => s.title.toLowerCase().includes(k) || s.artist.toLowerCase().includes(k));
  const artists = {};
  songs.filter(s => s.artist.toLowerCase().includes(k)).forEach(s => artists[s.artist] = (artists[s.artist] || 0) + 1);
  let html = `<p class="sub" style="margin:12px 0 0">${hits.length} songs for “${esc(query)}”</p>`;
  const names = Object.keys(artists);
  if (names.length) html += '<h3>Artists</h3><div class="chips">' +
    names.map(a => `<button class="chip" data-act="artist" data-name="${esc(a)}">${esc(a)} · ${artists[a]}</button>`).join('') + '</div>';
  html += '<h3>Songs</h3>' + (hits.length ? songRows(hits, 'res') : empty('No songs or artists match that search.'));
  el.innerHTML = html;
}

async function buildPlaylist(id) {
  const p = playlists.find(x => x.id === id);
  if (!p) { setTimeout(() => go('library', null, true), 0); return ['', null]; }
  const [{ data: ps }, { data: mem }] = await Promise.all([
    sb.from('playlist_songs').select('song_id,songs(id,title,artist,storage_path,owner,cover_path,lyrics)').eq('playlist_id', id),
    sb.from('playlist_members').select('user_id,profiles(username)').eq('playlist_id', id)
  ]);
  const list = (ps || []).map(r => r.songs).filter(Boolean);
  const editable = canEdit(p), isOwner = p.owner === me.id;
  const memberIds = new Set((mem || []).map(r => r.user_id));
  const invitable = friends.filter(f => !memberIds.has(f.id) && f.id !== p.owner);
  let html = head(p.name, 'by ' + (p.profiles?.username || 'unknown'));
  html += `<p><span class="tag">${p.is_public ? 'Public' : 'Private'}</span> ${p.collaborative ? '<span class="tag">Co-op</span>' : ''}</p>`;
  if (list.length) html += `<p><button class="green" data-act="playall" data-l="pl">▶ Play</button></p>`;
  if (isOwner) {
    html += `<div class="form" style="margin:8px 0 0">
      <label><input type="checkbox" id="tgPub" ${p.is_public ? 'checked' : ''}> Public</label>
      <label><input type="checkbox" id="tgColl" ${p.collaborative ? 'checked' : ''}> Co-op: members can add and remove songs</label>
      <button class="ghost" data-act="delpl" style="align-self:flex-start">Delete playlist</button></div>`;
  }
  html += '<h3>Songs</h3>' + (list.length
    ? songRows(list, 'pl', editable ? () => `<button class="ico" data-act="rm" aria-label="Remove from playlist">✕</button>` : null)
    : empty(editable ? 'Empty for now. Use ＋ on any song to add it.' : 'No songs in this playlist yet.'));
  html += '<h3>Members</h3><div class="chips">' +
    ((mem || []).length ? mem.map(r => `<span class="chip">${esc(r.profiles?.username || 'user')}${isOwner ? ` <a href="#" data-act="kick" data-uid="${r.user_id}" style="color:#f15e6c">remove</a>` : ''}</span>`).join('') : '<small>Just the owner.</small>') + '</div>';
  if (isOwner && invitable.length) html += '<h3>Invite a friend</h3><div class="chips">' +
    invitable.map(f => `<button class="chip" data-act="invite" data-uid="${f.id}">+ ${esc(f.username)}</button>`).join('') + '</div>';
  return [html, null];
}

async function saveProfile() {
  const btn = $('pfSave'); btn.disabled = true; btn.textContent = 'Saving…';
  const done = msg => { btn.disabled = false; btn.textContent = 'Save profile'; if (msg) toast(msg); };
  try {
    const patch = { bio: $('pfBio').value.trim() || null, fav_songs: pfFav };
    const oldAv = prof.avatar_path, oldBd = prof.backdrop_path, drop = [];
    const upload = async (bucket, file, limit) => {
      if (!file.type.startsWith('image/')) throw new Error('That file is not an image.');
      if (file.size > limit) throw new Error('That picture is too big (limit ' + (limit / 1048576) + ' MB).');
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = `${me.id}/${crypto.randomUUID()}.${ext}`;
      const { error } = await sb.storage.from(bucket).upload(path, file, { contentType: file.type });
      if (error) throw error;
      return path;
    };
    const avF = $('pfAv').files[0], bdF = $('pfBd').files[0];
    if (avF) { patch.avatar_path = await upload('avatars', avF, 5242880); if (oldAv) drop.push(['avatars', oldAv]); }
    else if (pfRmAv && oldAv) { patch.avatar_path = null; drop.push(['avatars', oldAv]); }
    if (bdF) { patch.backdrop_path = await upload('backdrops', bdF, 8388608); if (oldBd) drop.push(['backdrops', oldBd]); }
    else if (pfRmBd && oldBd) { patch.backdrop_path = null; drop.push(['backdrops', oldBd]); }
    const { error } = await sb.from('profiles').update(patch).eq('id', me.id);
    if (error) throw error;
    for (const [b, p] of drop) sb.storage.from(b).remove([p]);
    Object.assign(prof, patch); paintMe();
    done('Profile saved'); render(true);
  } catch (e) { done(e.message || 'Could not save'); }
}
async function buildUserProfile(id) {
  const { data: p } = await sb.from('profiles').select('id,username,bio,avatar_path,backdrop_path,fav_songs').eq('id', id).maybeSingle();
  if (!p) return [head('Profile', '') + empty('This profile could not be loaded.')];
  const favList = (p.fav_songs || []).map(x => songs.find(s => s.id === x)).filter(Boolean);

async function addFriend() {
  const name = $('addName').value.trim().toLowerCase().replace(/^@/, '');
  if (!name) return;
  if (name === me.username) { $('fmsg').textContent = "That's you."; return; }
  const { data: p } = await sb.from('profiles').select('id').eq('username', name).maybeSingle();

function b64url(bytes) { return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function connectSpotify() {

  localStorage.setItem('p2p_spotify_client', id);

async function handleSpotifyCallback() {
  const p = new URLSearchParams(location.search);

  const status = $('spotifyStatus');
  if (p.has('error')) { if (status) status.textContent = 'Spotify: ' + p.get('error'); history.replaceState(history.state,'',location.pathname); return; }
  try {
    const pkce = JSON.parse(sessionStorage.getItem('p2p_spotify_pkce') || '{}');
    if (!pkce.verifier || pkce.state !== p.get('state')) throw Error('Spotify security check failed. Connect again.');
    const res = await fetch('https://accounts.spotify.com/api/token', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:localStorage.getItem('p2p_spotify_client'),grant_type:'authorization_code',code:p.get('code'),redirect_uri:spotifyRedirect(),code_verifier:pkce.verifier})});

    sessionStorage.setItem('p2p_spotify_token',token.access_token);
    if (token.refresh_token) sessionStorage.setItem('p2p_spotify_refresh', token.refresh_token);
    sessionStorage.setItem('p2p_spotify_expiry', String(Date.now() + (token.expires_in || 3600) * 1000));

async function spotifyToken() {

  const refresh = sessionStorage.getItem('p2p_spotify_refresh');

}
async function checkWebsiteUpdate(force = false) {
  if (document.hidden || updateChecking || Date.now() - updateCheckedAt < (force ? 2000 : 8000) || navigator.onLine === false) return;
  updateChecking = true; updateCheckedAt = Date.now();
  try {
    const url = new URL(location.href);
    // Fetch only the app document; never send OAuth codes to the update probe.
    url.search = ''; url.hash = ''; url.searchParams.set('_check', Date.now());
    // After the first comparison, check just response headers when possible.
    // This keeps frequent checks small on mobile connections.
    if (lastUpdateETag) {
      const head = await fetch(url.href, {method:'HEAD', cache:'no-store', signal:AbortSignal.timeout(10000)});
      if (head.ok && head.headers.get('etag') === lastUpdateETag) { applyPendingUpdate(); return; }
    }
    const response = await fetch(url.href, {cache:'no-store', signal:AbortSignal.timeout(10000)});
    if (!response.ok) return;
    const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
    if (!doc.querySelector('#appBox') || !doc.querySelector('#audio')) return;
    lastUpdateETag = response.headers?.get('etag') || null;
    const version = sourceVersion(doc);
    if (version === deliveredVersion) { pendingVersion = null; $('updateAvailable').hidden = true; return; }
    pendingVersion = version;
    applyPendingUpdate();
  } catch (e) { /* Offline or host unavailable: keep the current app running. */ }
  finally { updateChecking = false; }
}
window.addEventListener('pageshow', () => checkWebsiteUpdate(true));
window.addEventListener('online', () => checkWebsiteUpdate(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkWebsiteUpdate(true); });
setInterval(checkWebsiteUpdate, 10000);
// Register from either URL; the worker then refreshes bare-address navigations too.
if ('serviceWorker' in navigator && window.isSecureContext) {
  const workerURL = new URL('./fresh-navigation-sw.js', location.href);
  navigator.serviceWorker.register(workerURL.href, {scope:new URL('./', workerURL).href, updateViaCache:'none'})
    .catch(error => console.warn('Fresh navigation registration unavailable:', error));
}
notifyWebsiteUpdate();
start();
checkWebsiteUpdate();
