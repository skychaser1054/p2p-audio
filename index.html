<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P Audio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root { --panel:#121212; --card:#1f1f1f; --sub:#b3b3b3; --green:#1db954; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#000; color:#fff;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h3 { margin:0 0 16px; font-size:24px; }
  h4 { margin:18px 0 6px; font-size:12px; color:var(--sub);
       letter-spacing:.08em; text-transform:uppercase; }
  small { color:var(--sub); }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:500px;
           padding:10px 20px; background:#fff; color:#000; transition:transform .1s; }
  button:hover { transform:scale(1.04); }
  input { display:block; width:100%; background:#2a2a2a; color:#fff; font:inherit;
          border:1px solid transparent; border-radius:6px; padding:10px 12px; }
  input:focus { outline:2px solid #fff; }
  #loading { text-align:center; margin-top:30vh; color:var(--sub); }
  #loginBox, #nameBox { max-width:340px; margin:12vh auto 0; background:var(--panel);
          padding:32px; border-radius:12px; }
  #loginBox input, #nameBox input { margin-bottom:12px; }
  #loginBox br { display:none; }
  #loginBox button[onclick="login()"], #nameBox button { background:var(--green); color:#000; }
  #loginBox button[onclick="signup()"] { background:transparent; color:#fff;
          border:1px solid #727272; }
  #msg, #nmsg { color:#f15e6c; }
  .layout { display:flex; gap:8px; padding:8px; height:calc(100vh - 100px); }
  #side { width:300px; flex-shrink:0; background:var(--panel); border-radius:8px;
          padding:16px; overflow-y:auto; }
  #main { flex:1; min-width:0; border-radius:8px; padding:28px; overflow-y:auto;
          background:linear-gradient(#2b3a67, var(--panel) 340px); }
  #status { font-size:30px; font-weight:800; margin:0 0 8px; }
  .hint { color:var(--sub); }
  .row { display:flex; gap:6px; align-items:center; margin:2px 0; padding:6px 8px;
         border-radius:6px; }
  .row:hover { background:var(--card); }
  .row span { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .row button { padding:5px 12px; font-size:12px; background:transparent; color:#fff;
         border:1px solid #727272; }
  .row button:first-of-type { background:var(--green); color:#000; border-color:var(--green); }
  #reqOut .row button { background:transparent; color:#fff; border:1px solid #727272; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:84px; background:#000;
         border-top:1px solid #222; padding:0 16px; display:flex; align-items:center;
         justify-content:space-between; gap:12px; }
  #barL, #barR { flex:1; }
  #barR { text-align:right; }
  #barC { display:flex; gap:10px; }
  #cmsg { color:var(--sub); font-size:14px; }
  .red { background:#e22134; color:#fff; }
  .ghost { background:transparent; color:var(--sub); border:1px solid #727272; padding:8px 16px; }
  @media (max-width:700px) {
    .layout { flex-direction:column; height:auto; padding-bottom:100px; }
    #side { width:100%; }
    #status { font-size:24px; }
  }

  #main { display:flex; flex-direction:column; }
  #tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { background:transparent; color:#fff; border:1px solid #727272; padding:8px 18px; }
  .tab.on { background:var(--green); color:#000; border-color:var(--green); }
  #callsPane { flex:1; }
  #musicFrame { display:none; flex:1; width:100%; min-height:520px; border:0; border-radius:8px; background:#000; }

  #main { background:linear-gradient(var(--tint,#2b3a67), var(--panel) 340px); }
  #pbg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:-1; display:none; }
  body.hasbg #pbg { display:block; }
  body.hasbg #side { background:rgba(18,18,18,.72); }
  body.hasbg #main { background:transparent; }
</style>
</head><body>

<img id="pbg" alt=""><p id="loading">Loading...</p>

<div id="loginBox" style="display:none">
  <h3>Log in</h3>
  <input id="email" type="email" placeholder="Email"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="login()">Log in</button>
  <button onclick="signup()">Sign up</button>
  <p id="msg"></p>
</div>

<div id="nameBox" style="display:none">
  <h3>Pick a username</h3>
  <input id="uname" placeholder="3-20 letters, numbers, _">
  <button onclick="saveName()">Save</button>
  <p id="nmsg"></p>
</div>

<div id="appBox" style="display:none">
  <div class="layout">
    <div id="side">
      <h4 style="margin-top:0">Add friend</h4>
      <div class="row">
        <input id="addName" placeholder="Username" style="flex:1;min-width:0">
        <button onclick="addFriend()">Add</button>
      </div>
      <small id="fmsg"></small>
      <h4>Requests</h4>
      <div id="reqIn"></div>
      <div id="reqOut"></div>
      <h4>Friends</h4>
      <div id="friendList"></div>
    </div>
    <div id="main"><div id="tabs"><button class="tab on" data-t="calls" onclick="tab('calls')">Calls</button><button class="tab" data-t="music" onclick="tab('music')">Music</button></div><div id="callsPane"><p id="status"></p>
      <p class="hint">Pick a friend on the left and press Call.</p>
      <audio id="out" autoplay></audio></div><iframe id="musicFrame" title="Music"></iframe></div>
    <div id="bar">
      <div id="barL"><span id="cmsg"></span></div>
      <div id="barC">
        <button id="muteBtn" onclick="toggleMute()">Mute</button>
        <button class="red" onclick="hangup()">Hang up</button>
      </div>
      <div id="barR"><button class="ghost" onclick="logout()">Log out</button></div>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://ueaqlinlpqgoxqlomyow.supabase.co',
  'sb_publishable_PMTk-r5GwbmaxK2Bw-KceA_rIF7dGGT'
);
const $ = id => document.getElementById(id);
const PREFIX = 'skychaser-audio-';
const pid = uid => PREFIX + uid;
let localStream = null, muted = false;
const mic = async () => {
  if (!localStream) localStream = await navigator.mediaDevices.getUserMedia({audio: true});
  localStream.getAudioTracks().forEach(t => t.enabled = !muted);
  return localStream;
};
function toggleMute() {
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !muted);
  $('muteBtn').textContent = muted ? 'Unmute' : 'Mute';
}
let peer, me, current;
let friends = [], incoming = [], outgoing = [];

function show(box) {
  $('loading').style.display = 'none';
  for (const b of ['loginBox', 'nameBox', 'appBox'])
    $(b).style.display = (b === box) ? 'block' : 'none';
}

/* ---------- login ---------- */
async function login() {
  if (!$('email').value || !$('pass').value) {
    $('msg').textContent = 'Enter your email and password first.'; return;
  }
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value, password: $('pass').value
  });
  if (error) $('msg').textContent = error.message; else start();
}
async function signup() {
  if (!$('email').value || !$('pass').value) {
    $('msg').textContent = 'Enter your email and password first.'; return;
  }
  const { error } = await sb.auth.signUp({
    email: $('email').value, password: $('pass').value
  });
  $('msg').textContent = error ? error.message
    : 'Account created. Confirm your email if asked, then log in.';
}
async function logout() { await sb.auth.signOut(); location.reload(); }

async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return show('loginBox');
  me = data.session.user;
  const { data: prof } = await sb.from('profiles')
    .select('username').eq('id', me.id).maybeSingle();
  if (!prof) return show('nameBox');
  me.username = prof.username;
  openApp();
}
async function saveName() {
  const name = $('uname').value.trim().toLowerCase();
  if (!/^[a-z0-9_]{3,20}$/.test(name)) {
    $('nmsg').textContent = 'Use 3-20 letters, numbers, or underscores.'; return;
  }
  const { error } = await sb.from('profiles').insert({ id: me.id, username: name });
  if (error) {
    $('nmsg').textContent = error.code === '23505'
      ? 'That username is taken, try another.' : error.message;
    return;
  }
  me.username = name;
  openApp();
}

/* ---------- friends ---------- */
function row(text, buttons) {
  const d = document.createElement('div');
  d.className = 'row';
  const s = document.createElement('span');
  s.textContent = text;
  d.appendChild(s);
  for (const [label, fn] of buttons) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = fn;
    d.appendChild(b);
  }
  return d;
}
function fill(id, items, make, emptyText) {
  const el = $(id);
  el.replaceChildren();
  if (!items.length && emptyText) {
    const p = document.createElement('small');
    p.textContent = emptyText;
    el.appendChild(p);
  }
  items.forEach(i => el.appendChild(make(i)));
}
function render() {
  fill('reqIn', incoming, i => row('@' + i.username,
    [['Accept', () => respond(i.rid, true)], ['Decline', () => respond(i.rid, false)]]),
    'No requests');
  fill('reqOut', outgoing, i => row('@' + i.username + ' (pending)',
    [['Cancel', () => removeRow(i.rid)]]), '');
  fill('friendList', friends, i => row('@' + i.username,
    [['Call', () => callFriend(i)], ['Remove', () => removeRow(i.rid)]]),
    'No friends yet');
}
async function refresh() {
  const { data: rows, error } = await sb.from('friend_requests')
    .select('id,sender,receiver,status');
  if (error || !rows) return;
  const ids = [...new Set(rows.flatMap(r => [r.sender, r.receiver]))]
    .filter(i => i !== me.id);
  const names = {};
  if (ids.length) {
    const { data: ps } = await sb.from('profiles').select('id,username').in('id', ids);
    (ps || []).forEach(p => names[p.id] = p.username);
  }
  friends = []; incoming = []; outgoing = [];
  for (const r of rows) {
    const other = r.sender === me.id ? r.receiver : r.sender;
    const item = { rid: r.id, id: other, username: names[other] || '?' };
    if (r.status === 'accepted') friends.push(item);
    else if (r.receiver === me.id) incoming.push(item);
    else outgoing.push(item);
  }
  render();
}
async function addFriend() {
  const name = $('addName').value.trim().toLowerCase().replace(/^@/, '');
  if (!name) return;
  if (name === me.username) { $('fmsg').textContent = "That's you."; return; }
  const { data: p } = await sb.from('profiles')
    .select('id').eq('username', name).maybeSingle();
  if (!p) { $('fmsg').textContent = 'No user with that username.'; return; }
  const { error } = await sb.from('friend_requests')
    .insert({ sender: me.id, receiver: p.id, status: 'pending' });
  $('fmsg').textContent = error
    ? (error.code === '23505' ? 'Already requested, or already friends.' : error.message)
    : 'Request sent.';
  if (!error) $('addName').value = '';
  refresh();
}
async function respond(rid, accept) {
  if (accept) await sb.from('friend_requests').update({ status: 'accepted' }).eq('id', rid);
  else await sb.from('friend_requests').delete().eq('id', rid);
  refresh();
}
async function removeRow(rid) {
  await sb.from('friend_requests').delete().eq('id', rid);
  refresh();
}

/* ---------- calls ---------- */
function setCall(c, who) {
  current = c;
  $('cmsg').textContent = 'On a call with @' + who;
  c.on('stream', s => $('out').srcObject = s);
  c.on('close', () => {
    $('cmsg').textContent = 'Call ended.';
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  });
}
async function callFriend(f) {
  $('cmsg').textContent = 'Calling @' + f.username + '...';
  setCall(peer.call(pid(f.id), await mic()), f.username);
}
function hangup() { if (current) current.close(); }

async function openApp() {
  show('appBox'); $('musicFrame').src = 'music.html';
  $('status').textContent = 'Connecting...';
  await refresh();
  setInterval(refresh, 10000);
  peer = new Peer(pid(me.id));
  peer.on('open', () => $('status').textContent = 'Ready: @' + me.username);
  peer.on('error', e => $('status').textContent = 'Error: ' + e.type);
  peer.on('call', async c => {
    const f = friends.find(x => pid(x.id) === c.peer);
    if (!f) { c.close(); return; }
    c.answer(await mic());
    setCall(c, f.username);
  });
}

function tab(t) {
  const music = t === 'music';
  $('callsPane').style.display = music ? 'none' : 'block';
  $('musicFrame').style.display = music ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
const PTH = {green:['#1db954','#1d3a2a'],blue:['#3b82f6','#1b2f5a'],purple:['#a855f7','#3a1f5c'],pink:['#ec4899','#5c1f3f'],orange:['#f97316','#5c3216'],red:['#ef4444','#5c1f1f'],teal:['#14b8a6','#154a46'],gold:['#eab308','#514514']};
async function applyMusicUI() {
  try {
    const st = JSON.parse(localStorage.getItem('musicSettings') || '{}'), t = PTH[st.theme] || PTH.green, r = document.documentElement.style;
    r.setProperty('--green', t[0]); r.setProperty('--tint', t[1]);
  } catch (e) {}
  try {
    const db = await new Promise((res, rej) => { const q = indexedDB.open('musicui', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(); });
    const b = await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get('bg'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
    if (b) { $('pbg').src = URL.createObjectURL(b); document.body.classList.add('hasbg'); } else document.body.classList.remove('hasbg');
  } catch (e) {}
}
window.addEventListener('message', e => { if (e.origin === location.origin && e.data === 'musicui') applyMusicUI(); });
applyMusicUI();
start();
</script>
</body></html>
